<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doraemon & English Present Continuous</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0284c7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0f2fe;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      color: #0369a1;
      margin-bottom: 15px;
    }
    .audio-btn {
      background: #38bdf8;
      border: none;
      color: white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 18px;
    }
    .dialogue {
      background: #fff7ed;
      border: 2px solid #fdba74;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #9a3412;
      font-weight: bold;
    }
    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .question-box {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      background: #f8fafc;
      border: 2px dashed #38bdf8;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      color: #0f172a;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      padding: 12px;
      border: 2px solid #cbd5e1;
      background: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      color: #1e293b;
    }
    .btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
    .text-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .word-pool, .word-target {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 50px;
      padding: 8px;
      border-radius: 10px;
    }
    .word-target { background: #f1f5f9; border: 2px dashed #38bdf8; align-items: center; }
    .word-pool { background: #fafafa; border: 1px solid #e2e8f0; }
    .word-chip {
      background: #ffffff;
      border: 2px solid #0284c7;
      color: #0284c7;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .word-chip:active { transform: scale(0.95); }
    .tip {
      margin-top: 15px;
      padding: 10px;
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      font-size: 13px;
      display: none;
      color: #166534;
    }
    .next-btn {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #f43f5e;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<div class="card" id="quiz">
  <div class="top-bar">
    <span>🏆 Dorayakis: <span id="score">0</span></span>
    <span>Frase: <span id="num">1</span>/<span id="total">10</span></span>
    <button class="audio-btn" id="music-toggle" onclick="toggleMusic()">🔊</button>
  </div>

  <div class="dialogue" id="dialogue">🐱 Doraemon: ¡Aprende Present Continuous para el examen!</div>

  <span class="badge" id="type-badge">Ejercicio</span>

  <div class="question-box" id="q-text">Cargando...</div>

  <div id="interactive-area"></div>

  <div class="tip" id="tip"></div>

  <button class="next-btn" id="next" onclick="nextQ()">¡Siguiente Reto! 🚀</button>
</div>

<script>
// --- MOTOR DE AUDIO NATIVO Y GARANTIZADO ---
var audioCtx = null;
var isMuted = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleMusic() {
  isMuted = !isMuted;
  document.getElementById('music-toggle').innerText = isMuted ? '🔇' : '🔊';
}

function playNote(freq, duration, type, delay) {
  if (isMuted) return;
  initAudio();
  delay = delay || 0;

  setTimeout(function() {
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }, delay);
}

// Melodía reconocible de Doraemon ("Ojalá mis sueños se hicieran realidad...")
function playDoraemonSound() {
  var notes = [523, 659, 783, 880, 783, 659, 523, 659, 783, 1046];
  var times = [0, 150, 300, 450, 600, 750, 900, 1050, 1200, 1400];
  notes.forEach(function(freq, i) {
    playNote(freq, 0.2, 'triangle', times[i]);
  });
}

function playWrongSound() {
  playNote(220, 0.15, 'sawtooth', 0);
  playNote(165, 0.25, 'sawtooth', 120);
}

function playVictoryFanfare() {
  var winNotes = [523, 659, 783, 1046, 0, 783, 1046, 1318];
  winNotes.forEach(function(f, i){
    if (f > 0) playNote(f, 0.25, 'triangle', i * 140);
  });
}

// --- EJERCICIOS DEL CUADERNO REAL ---
var exercises = [
  // 1. Fill in the blanks
  { type: "fill", q: "She ___ (read) a book right now.", ans: ["is reading"], tip: "She + is + reading", char: "👧 Shizuka" },
  { type: "fill", q: "They ___ (play) football in the park.", ans: ["are playing"], tip: "They + are + playing", char: "🦊 Suneo" },
  { type: "fill", q: "I ___ (not watch) TV at the moment.", ans: ["am not watching", "aren't watching", "a'm not watching"], tip: "I + am not + watching", char: "🤓 Nobita" },
  { type: "fill", q: "We ___ (study) for the test.", ans: ["are studying"], tip: "We + are + studying", char: "🐱 Doraemon" },
  { type: "fill", q: "He ___ (cook) dinner in the kitchen.", ans: ["is cooking"], tip: "He + is + cooking", char: "🎤 Gigante" },
  { type: "fill", q: "My friends ___ (travel) to Italy this week.", ans: ["are traveling", "are travelling"], tip: "My friends (they) + are + traveling", char: "👧 Shizuka" },
  { type: "fill", q: "___ you ___ (listen) to me?", ans: ["Are listening", "Are / listening"], tip: "Pregunta: Are + you + listening?", char: "🐱 Doraemon" },
  { type: "fill", q: "The dog ___ (sleep) on the sofa.", ans: ["is sleeping"], tip: "The dog (it) + is + sleeping", char: "🎀 Dorami" },

  // 2. Put words in order
  { type: "order", words: ["is", "she", "music", "listening", "to"], ans: "she is listening to music", tip: "Sujeto + is + verb-ing + complemento", char: "👧 Shizuka" },
  { type: "order", words: ["are", "they", "a movie", "watching"], ans: "they are watching a movie", tip: "Sujeto + are + verb-ing", char: "🦊 Suneo" },
  { type: "order", words: ["am", "I", "homework", "doing", "my"], ans: "i am doing my homework", tip: "I + am + doing...", char: "🤓 Nobita" },
  { type: "order", words: ["is", "he", "running", "in the park"], ans: "he is running in the park", tip: "He + is + running (CVC doubles n)", char: "🎤 Gigante" },

  // 3. Make negative sentences
  { type: "choice", q: "Cambia a NEGATIVA: 'She is working'", opts: ["She isn't working", "She is working not", "She don't working"], correct: 0, tip: "is -> isn't (is not)", char: "🐱 Doraemon" },
  { type: "choice", q: "Cambia a NEGATIVA: 'They are playing'", opts: ["They aren't playing", "They isn't playing", "They not playing"], correct: 0, tip: "are -> aren't (are not)", char: "🦊 Suneo" },
  { type: "choice", q: "Cambia a NEGATIVA: 'I am studying'", opts: ["I am not studying", "I aren't studying", "I isn't studying"], correct: 0, tip: "I am -> I am not", char: "🤓 Nobita" },

  // 4. Make questions
  { type: "fill", q: "Haz la PREGUNTA: 'You are reading'", ans: ["Are you reading?", "Are you reading"], tip: "Invierte el orden: Are + you + reading?", char: "👧 Shizuka" },
  { type: "fill", q: "Haz la PREGUNTA: 'She is cooking'", ans: ["Is she cooking?", "Is she cooking"], tip: "Invierte: Is + she + cooking?", char: "🎀 Dorami" },
  { type: "fill", q: "Haz la PREGUNTA: 'They are sleeping'", ans: ["Are they sleeping?", "Are they sleeping"], tip: "Invierte: Are + they + sleeping?", char: "🎤 Gigante" },

  // 5. Choose the correct option
  { type: "choice", q: "Elige la opción correcta:", opts: ["I am watching TV", "I do watching TV", "I watching TV"], correct: 0, tip: "I + am + watching", char: "🤓 Nobita" },
  { type: "choice", q: "Elige la opción correcta:", opts: ["She is playing tennis", "She are playing tennis", "She am playing tennis"], correct: 0, tip: "She + is", char: "👧 Shizuka" },
  { type: "choice", q: "Elige la opción correcta:", opts: ["We are learning English", "We is learning English", "We am learning English"], correct: 0, tip: "We + are", char: "🐱 Doraemon" }
];

var currentList = [];
var index = 0;
var score = 0;
var answered = false;

function startQuiz() {
  currentList = exercises.sort(function() { return Math.random() - 0.5; }).slice(0, 10);
  index = 0;
  score = 0;
  document.getElementById('total').innerText = currentList.length;
  showQuestion();
}

function showQuestion() {
  answered = false;
  var ex = currentList[index];

  document.getElementById('num').innerText = index + 1;
  document.getElementById('score').innerText = score;
  document.getElementById('dialogue').innerText = ex.char + ": ¡A resolver!";
  document.getElementById('q-text').innerText = ex.q || "Ordena la siguiente frase:";
  document.getElementById('tip').style.display = 'none';
  document.getElementById('next').style.display = 'none';

  var area = document.getElementById('interactive-area');
  area.innerHTML = '';

  var badge = document.getElementById('type-badge');

  if (ex.type === "fill") {
    badge.innerText = "✍️ Escribe el verbo correcto";
    area.innerHTML = '<input type="text" id="text-ans" class="text-input" placeholder="Escribe tu respuesta aquí..." autocomplete="off">' +
                     '<button class="submit-btn" onclick="checkFill()">Comprobar</button>';
  } else if (ex.type === "choice") {
    badge.innerText = "🔘 Selecciona la opción correcta";
    var optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    ex.opts.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = opt;
      btn.onclick = function() { checkChoice(idx); };
      optsDiv.appendChild(btn);
    });
    area.appendChild(optsDiv);
  } else if (ex.type === "order") {
    badge.innerText = "🧩 Toca las palabras para ordenar";
    
    var target = document.createElement('div');
    target.className = 'word-target';
    target.id = 'word-target';

    var pool = document.createElement('div');
    pool.className = 'word-pool';
    pool.id = 'word-pool';

    var shuffled = ex.words.slice().sort(function() { return Math.random() - 0.5; });
    shuffled.forEach(function(w) {
      var chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.innerText = w;
      chip.onclick = function() { toggleWord(chip); };
      pool.appendChild(chip);
    });

    area.appendChild(target);
    area.appendChild(pool);

    var checkBtn = document.createElement('button');
    checkBtn.className = 'submit-btn';
    checkBtn.innerText = 'Comprobar Orden';
    checkBtn.onclick = checkOrder;
    area.appendChild(checkBtn);
  }
}

function toggleWord(chip) {
  if (answered) return;
  initAudio();
  var target = document.getElementById('word-target');
  var pool = document.getElementById('word-pool');

  if (chip.parentElement === pool) {
    target.appendChild(chip);
  } else {
    pool.appendChild(chip);
  }
}

function checkChoice(selected) {
  if (answered) return;
  answered = true;

  var ex = currentList[index];
  var btns = document.querySelectorAll('.btn');

  if (selected === ex.correct) {
    btns[selected].classList.add('correct');
    score += 10;
    playDoraemonSound();
  } else {
    btns[selected].classList.add('incorrect');
    btns[ex.correct].classList.add('correct');
    playWrongSound();
  }
  finishQuestion(ex.tip);
}

function checkFill() {
  if (answered) return;

  var val = document.getElementById('text-ans').value.trim().toLowerCase();
  if (!val) return;
  answered = true;

  var ex = currentList[index];
  var isRight = ex.ans.some(function(a){ return a.toLowerCase() === val; });

  if (isRight) {
    document.getElementById('text-ans').style.borderColor = '#22c55e';
    document.getElementById('text-ans').style.background = '#dcfce7';
    score += 10;
    playDoraemonSound();
  } else {
    document.getElementById('text-ans').style.borderColor = '#ef4444';
    document.getElementById('text-ans').style.background = '#fee2e2';
    playWrongSound();
  }
  finishQuestion(ex.tip + " (Correcto: " + ex.ans[0] + ")");
}

function checkOrder() {
  if (answered) return;

  var target = document.getElementById('word-target');
  var chips = target.querySelectorAll('.word-chip');
  if (chips.length === 0) return;

  answered = true;
  var userWords = [];
  chips.forEach(function(chip) {
    userWords.push(chip.innerText);
  });

  var ex = currentList[index];
  var userSentence = userWords.join(' ').toLowerCase();

  if (userSentence === ex.ans.toLowerCase()) {
    target.style.background = '#dcfce7';
    target.style.borderColor = '#22c55e';
    score += 10;
    playDoraemonSound();
  } else {
    target.style.background = '#fee2e2';
    target.style.borderColor = '#ef4444';
    playWrongSound();
  }
  finishQuestion(ex.tip + " (Correcto: " + ex.ans + ")");
}

function finishQuestion(tipText) {
  document.getElementById('score').innerText = score;
  var tip = document.getElementById('tip');
  tip.innerText = tipText;
  tip.style.display = 'block';
  document.getElementById('next').style.display = 'block';
}

function nextQ() {
  index++;
  if (index < currentList.length) {
    showQuestion();
  } else {
    var maxScore = currentList.length * 10;
    var isPleno = (score === maxScore);

    if (isPleno) playVictoryFanfare();

    document.getElementById('quiz').innerHTML = 
      '<div style="text-align:center; padding: 20px;">' +
      '<h2>' + (isPleno ? '🌟 ¡PLENO ABSOLUTO! 🌟' : '🏆 ¡Ronda Finalizada!') + '</h2>' +
      '<p style="margin: 15px 0; font-size:18px;">Conseguiste <b>' + score + '</b> de ' + maxScore + ' Dorayakis.</p>' +
      '<p>' + (isPleno ? '¡Eres un maestro del Present Continuous! 🍩🎉' : '¡Sigue practicando para el pleno!') + '</p>' +
      '<button class="next-btn" style="display:block; margin-top:20px;" onclick="location.reload()">🔄 Jugar Otra Vez</button>' +
      '</div>';
  }
}

startQuiz();
</script>

</body>
</html>
